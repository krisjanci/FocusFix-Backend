[project]
name = "focusfix-backend"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "coremltools>=9,<10",
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<1.6",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
